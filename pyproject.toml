[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora: reservas, visitantes e regulamento com Google ADK e FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk===2.2.0",
    "fastapi>=0.133",
    "uvicorn>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
    "asyncpg>=0.31",
    "python-dotenv>=1",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "gemini: testes que chamam o Gemini de verdade (rodam só com HARNESS_GEMINI=1)",
]
